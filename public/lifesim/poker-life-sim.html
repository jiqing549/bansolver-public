  {id:161,title:'餐桌上的银行流水',text:'父亲翻到你扑克网站的充值记录，把手机摔在饭桌上。母亲在一旁抹眼泪。整桌菜凉了。',minAge:18,maxAge:23,weight:6,mode:'once',conditions:{maxAge:23},choices:[{text:'把盈利记录摆出来，用数字说话',effects:{mental:-5,bankroll:2000,skill:2},feedback:'你打开 APP 显示累计盈利。父亲看了很久，最后说：数字我不懂。但你多久没回家吃饭了？你哑口无言——你用数据赢了辩论，却输了更重要的东西。'},{text:'道歉，承诺每周回家吃三次饭',effects:{mental:8,reputation:2,bankroll:-1000},feedback:'你低了头。那之后你真的每周回来三次。父亲不再提扑克——直到有天你看到他偷偷搜德州扑克是不是赌博。'}]},
  {id:162,title:'凌晨四点的多桌',text:'女朋友推门进来，看到你凌晨四点还在 8 桌齐开。"你是在打牌，还是在逃避我？"屏幕的蓝光照着你们俩，谁都没动。',minAge:20,maxAge:28,weight:7,mode:'repeat',conditions:{maxAge:30,maxMental:70},choices:[{text:'关掉电脑，今晚陪她',effects:{mental:8,health:3,bankroll:-2000},feedback:'你关了电脑。你们聊到天亮。你发现她已经两周没跟你说超过十句话了——而你居然没察觉。'},{text:'再打一小时，马上就好',effects:{mental:-8,bankroll:3000,health:-2},feedback:'你说一小时。三小时后天亮了，她已经睡下。你看着赢来的 3000 块，钱在，人却越来越远。'}]},
  {id:163,title:'同居女友的我们什么时候正常',text:'她想要朝九晚五的稳定伴侣，你每周横跨三个时区打线上。搬家那天她问："我们什么时候能像正常情侣一样，周末一起吃个早午餐？"',minAge:24,maxAge:32,weight:7,mode:'once',conditions:{minBankroll:20000},choices:[{text:'调整作息，每周留两天完全给她',effects:{mental:10,reputation:3,bankroll:-5000},feedback:'你设了无牌日。第三周你开始享受早午餐。她笑着说：你笑起来像个正常人了。你才发现，你差点忘了正常人怎么笑。'},{text:'解释这是职业高峰期，再等两年',effects:{mental:-6,bankroll:8000,skill:2},feedback:'你说了两年。她说你上次也是这么说的。那晚她没接你的电话。你赢了 8000，但她的沉默比任何 bad beat 都重。'}]},
  {id:164,title:'父亲第一次住院',text:'主赛事 Day4，你筹码排第 12。母亲电话："你爸心梗，进了 ICU。"赛事还剩 3 天，奖金圈近在咫尺。',minAge:30,maxAge:45,weight:5,mode:'once',conditions:{minBankroll:30000},choices:[{text:'立即弃赛，赶去医院',effects:{bankroll:-10000,mental:12,reputation:5,health:-3},feedback:'你弃赛了。父亲醒来第一句话：比赛怎么样了？你鼻子一酸：我赢了更重要的一手。他笑了，握了握你的手。'},{text:'打完这三天，奖金够付医药费',effects:{bankroll:40000,mental:-15,health:-5},feedback:'你打完了，拿了 4 万。赶回医院时父亲已脱离危险。但母亲看你的眼神变了。那 4 万块你一分没敢动——它烫手。'}]},
  {id:165,title:'怀孕期能否停下巡回',text:'妻子怀孕 7 个月。下个月是 EPT 蒙特卡洛，你已经报名。她说："你不去也行，对吧？"语气是问句，但眼睛在等一个答案。',minAge:30,maxAge:40,weight:6,mode:'once',conditions:{minBankroll:50000},choices:[{text:'退赛，全程陪产',effects:{bankroll:-5000,mental:15,reputation:2},feedback:'你退了赛。孩子出生那天你握着妻子的手，比握任何筹码都紧。你发现自己原来还会为别的事这么紧张。'},{text:'去蒙特卡洛，三天后赶回',effects:{bankroll:20000,mental:-10,reputation:3},feedback:'你去了。赢了 2 万。但决赛那天妻子提前宫缩，你在机场贵宾室接到电话。孩子出生那 6 小时你不在。2 万块，买不回那 6 小时。'}]},
  {id:166,title:'离婚协议里的bankroll分割',text:'60 万 bankroll 要对半切。你看着那张协议，第一次意识到：bankroll 不只是钱，它也是你婚姻的代价。',minAge:38,maxAge:50,weight:5,mode:'once',conditions:{minBankroll:300000},choices:[{text:'痛快签字，钱可以再赚，体面不能丢',effects:{bankroll:-300000,mental:8,reputation:5},feedback:'你签了。走出民政局你们居然一起去吃了顿饭。她说：早这样就好了。有些体面，是离婚才学会的。'},{text:'死磕到底，请最好的律师',effects:{bankroll:-100000,mental:-15,reputation:-3},feedback:'你打了半年官司，多保住了 20 万。但你的 winrate 在那半年崩了——你每天在打牌和打官司之间撕裂。'}]},
  {id:167,title:'异国生病无人照顾',text:'布拉格 EPT，你高烧 39 度倒在酒店。房间没人，语言不通。你盯着天花板，第一次认真想：游牧的自由，是不是另一种孤独？',minAge:25,maxAge:40,weight:6,mode:'repeat',conditions:{maxBankroll:100000},choices:[{text:'硬扛过去，这就是自由的代价',effects:{health:-8,mental:-5,bankroll:-2000},feedback:'你扛了三天。你坐在窗边看着布拉格的屋顶，第一次怀疑：一个人自由地走在世界，和一个人孤独地走在世界，区别在哪？'},{text:'订最近一班飞机回家',effects:{bankroll:-5000,health:5,mental:8},feedback:'你飞回家了。母亲开门看到你，什么都没问，给你煮了碗面。你走了那么远，才发现家是你病了时唯一想去的地方。'}]},
  {id:168,title:'我到底属于哪里',text:'护照盖满了章，酒店成了第二个家。某天你在东京机场转机，突然想不起今天是星期几，也想不起上一次在自己床上醒来是什么时候。',minAge:28,maxAge:42,weight:7,mode:'once',conditions:{minBankroll:80000,minReputation:30},choices:[{text:'订一个根据地，每年固定回去三个月',effects:{mental:12,bankroll:-8000,reputation:3},setFlag:'rooted_nomad',feedback:'你在里斯本租了个小公寓。每年回去三个月。你发现：自由不是没有根，是自己选择在哪里扎根。'},{text:'继续漂泊，停下来我会慌',effects:{mental:-8,bankroll:12000,skill:2},feedback:'你继续走。机场贵宾室的服务员都认识你了——她们叫你那个总是在路上的中国人。你笑着应了，心里却空了一块。'}]},
  // ===== Phase 2 极端坏事事件（id 169+）：四个属性的低值/极低值危机 =====

  // ---- skill 低值：技术过时 / 被新一代碾压（原仅 id=2 一个低值事件，现补全）----
  {id:169,title:'听不懂他们在说什么',text:'study group 里年轻人讨论 GTO 频率、node locking、blocker 效应。你听得懂每个词，但连不成句子。三年前你还是他们请教的对象，现在你连插话都找不到缝隙。',minAge:30,maxAge:55,weight:6,mode:'repeat',conditions:{maxSkill:35,minSkill:20},choices:[{text:'放下身段，从基础重新学',effects:{skill:8,mental:-5,bankroll:-3000},feedback:'你买了一套 solver 课程，每天像新手一样记笔记。两周后你第一次跟上了讨论——但那种"我曾经很强"的落差，比任何 downswing 都磨人。'},{text:'承认自己过时了，转打娱乐局',effects:{skill:-3,mental:6,bankroll:2000},feedback:'你退出了 study group，转去打低级别的娱乐局。轻松，但你知道自己在逃避。某天你看到当年的徒弟上了 NL2K，关掉了手机。'}]},
  {id:170,title:'被19岁的对手当鱼钓',text:'对面那个 19 岁的小孩，用一套你看不懂的 line 把你 3-bet light 了三次。第三次你终于忍不住 4-bet 全压，他秒 call 亮出 AA。你看着他的笑容，意识到：在他眼里，你就是那条鱼。',minAge:35,maxAge:58,weight:5,mode:'repeat',conditions:{maxSkill:40,minSkill:25},choices:[{text:'虚心复盘，向年轻人请教',effects:{skill:7,mental:-8,reputation:3},feedback:'你硬着头皮私信那个小孩，请教他的 range 构造。他回了一大段，最后说"叔你底子还在，就是版本旧了"。你保存了那段话，像保存一剂药。'},{text:'不学了，降级到能赢的级别',effects:{skill:-2,mental:4,bankroll:5000},feedback:'你降到 NL100，那里没有 solver 原住民。你又赢了，但赢得心虚——你知道这不是你变强了，是对手变弱了。'}]},

  // ---- reputation 低值：社死 / 被联盟封杀（原零个低值事件，现补全）----
  {id:171,title:'论坛上的那个帖子',text:'2+2 上一个帖子盖了 400 楼，标题是"复盘 XXX 的十大离谱操作"。帖子里每一条都是你。置顶评论：这种人怎么还能在牌桌上有位置？',minAge:25,maxAge:50,weight:6,mode:'repeat',conditions:{maxReputation:20},choices:[{text:'发长文回应，逐条反驳',effects:{reputation:5,mental:-8,skill:-2},feedback:'你写了 5000 字。结果是引来更多嘲讽。你学到：在舆论场里，解释等于认罪。声望这东西，碎了就很难拼。'},{text:'沉默，用牌桌结果说话',effects:{reputation:-3,mental:3,bankroll:6000,skill:2},feedback:'你闭嘴了，埋头打牌，赢了 6000。但论坛的帖子还在，每一个新赞助商谈合作前都会搜到它。沉默有时候是最贵的策略。'}]},
  {id:172,title:'赞助商集体撤退',text:'你打开邮箱：三家赞助商同一天发来解约函。措辞礼貌，理由都是"品牌战略调整"。你知道真正的原因——上周那场直播事故之后，你已经成了品牌的负资产。',minAge:28,maxAge:52,weight:5,mode:'once',conditions:{maxReputation:15,minReputation:1},choices:[{text:'接受现实，重新靠牌技立足',effects:{mental:-5,bankroll:-10000,skill:5},feedback:'解约意味着每月少 1 万收入。你把这股怒气全砸进训练——声望没了，至少技术还在。三个月后你的 winrate 创了新高，但没人知道了。'},{text:'搞一波炒作翻红',effects:{reputation:8,mental:-6,bankroll:3000},feedback:'你搞了个争议性直播，流量回来了，赞助商也回来了一家。但你看着自己的脸出现在那些标题党里，觉得陌生——你翻红的方式，正是当初让你社死的方式。'}]},
  {id:173,title:'被线下场地集体拒入',text:'你走进常去的俱乐部，前台小姐礼貌地拦住你："抱歉，老板说……您最近不太方便来。"你追问，她支吾。你懂了——你的名字上了某个共享黑名单。',minAge:30,maxAge:55,weight:4,mode:'once',conditions:{maxReputation:10},choices:[{text:'找老板当面谈，问个明白',effects:{reputation:3,mental:-6,bankroll:-2000},feedback:'老板见了你，叹气："不是我的意思，是上面几个老板通气了。你得罪过谁？"你想了一圈，想不出。有些社死，连原因都不给你。'},{text:'不争了，彻底转线上',effects:{reputation:-2,mental:4,skill:3},feedback:'你转身走了，从此只打线上。线下的人脉、信息、软局全断了。你省下了社交成本，但也把自己关进了一个更小的世界。'}]},

  // ---- mental 极低值(≤20)：精神崩溃（原最深只到≤25，且无归零结局）----
  {id:174,title:'连续72小时没有合眼',text:'不是在打牌，是睡不着。闭上眼就是那手 bad beat，那张河牌，那个对手的笑。你已经三天没洗澡，冰箱里只有半瓶可乐。镜子里的你，你自己都不认识。',minAge:24,maxAge:50,weight:5,mode:'repeat',conditions:{maxMental:20},choices:[{text:'给心理热线打电话',effects:{mental:15,health:5,reputation:-3},feedback:'电话那头的声音很平静。你哭了 20 分钟，挂掉时天已经亮了。你洗了个澡，第一次觉得"活着"比"赢"重要。但圈里有人知道了——你被贴上了"精神不稳定"的标签。'},{text:'再扛扛，我不能垮',effects:{mental:-8,health:-8,skill:-3},feedback:'你又扛了一周。第七天你在牌桌上对着一个 air 牌 all-in 了 5 万，被秒 call。你看着筹码消失，大脑一片空白——这不是 tilt，这是机器故障。'}]},
  {id:175,title:'在牌桌上大哭',text:'你也不知道为什么。一手普通的 70/30 bad beat 之后，眼泪就下来了。全桌静默。荷官递给你纸巾。你捂着脸，听到有人在低声说"他是不是出什么事了"。',minAge:25,maxAge:55,weight:4,mode:'once',conditions:{maxMental:15},choices:[{text:'离开牌桌，正视自己的崩溃',effects:{mental:12,health:5,bankroll:-5000,setFlag:'breakdown_acknowledged'},feedback:'你站起身走了。那天你没有回酒店，而是一个人在河边坐到天黑。你第一次承认：扑克正在杀死你。这个承认，是你自救的开始。'},{text:'擦干眼泪，继续打',effects:{mental:-10,reputation:-5,skill:2},feedback:'你擦了眼泪说"没事继续"。全桌没人信。你确实打完了那场，但"那个在牌桌上哭的人"成了你的新标签。每一桌你坐下，都有人多看你一眼。'}]},
  {id:176,title:'医生说你是重度抑郁',text:'心理科诊室。医生看着量表说："你的分数已经到了需要药物干预的程度。"你想起这两年：失眠、暴食、对什么都提不起劲。你以为只是下风期，原来是病。',minAge:26,maxAge:55,weight:6,mode:'once',conditions:{maxMental:18},choices:[{text:'遵医嘱，吃药治疗，暂停打牌',effects:{mental:20,health:8,bankroll:-15000},feedback:'药起效很慢，但第三周你第一次睡了个整觉。你暂停了打牌，bankroll 没涨但也没掉。你发现：活着本身，就是一种 +EV。'},{text:'我不需要药，我只需要赢回来',effects:{mental:-12,health:-6,bankroll:8000},feedback:'你把处方单塞进抽屉，回到牌桌。赢了 8000，但药没吃，病还在。你以为赢能治病——这是抑郁症最擅长的谎言。'}]},

  // ---- health 极低值(≤20)：濒死 / 住院（原最深只到≤60，现补极低值）----
  {id:177,title:'牌桌上心绞痛',text:'打到第 11 个小时，胸口像被一只手攥住。冷汗、恶心、左臂发麻。你看着手里的 AA，第一次觉得它不重要了。',minAge:38,maxAge:58,weight:5,mode:'once',conditions:{maxHealth:20},choices:[{text:'立刻弃牌，叫救护车',effects:{health:15,mental:8,bankroll:-20000,reputation:3},feedback:'你在医院住了五天。医生说再来晚半小时就是心梗。你看着吊瓶，想起这些年熬过的夜、喝过的红牛、忍过的疼。身体终于跟你摊牌了。'},{text:'忍着打完这手再说',effects:{health:-15,mental:-5,bankroll:5000},feedback:'你 all-in 赢了那手。但站起来时眼前一黑，直接栽在牌桌上。醒来在 ICU，医生说"你差点没命"。那 5000 块，差点是你的丧葬费。'}]},
  {id:178,title:'医生的最后通牒',text:'复查报告。医生摘下眼镜看着你："你的肝脏指标、血压、颈椎，三样都在报警。我不是吓你——再这样打长时赛，五年内会有不可逆的损伤。这是最后通牒。"',minAge:40,maxAge:58,weight:6,mode:'once',conditions:{maxHealth:15,minHealth:1},choices:[{text:'彻底改变生活方式，降级养生',effects:{health:25,mental:5,bankroll:-30000,skill:-3},feedback:'你戒了红牛，开始健身，每天只打 4 小时。bankroll 增长慢了，但你第一次觉得"还能打 20 年"是可能的。活着，才有复利。'},{text:'医生都爱夸张，我扛得住',effects:{health:-10,mental:-3,bankroll:15000},feedback:'你没听。三个月后你在牌桌上第二次心绞痛，这次没那么幸运——你被抬走时，听到有人在说"他就是上次那个"。'}]},

  // ---- 交叉极低值：bankroll+mental 双低（最危险的组合）----
  {id:179,title:'天台上的风',text:'bankroll 归零，mental 见底。你站在 28 楼的天台上，风吹着你的衣角。手机响了，是妈妈的电话。你没有接。城市在你脚下亮着，像一张巨大的、你永远读不懂的牌桌。',minAge:22,maxAge:55,weight:2,mode:'once',conditions:{maxBankroll:2000,maxMental:15},choices:[{text:'接妈妈的电话',effects:{mental:25,health:10},feedback:'你接了。妈妈只是问"吃饭了吗"。你哭了，说"妈，我想回家"。她说"回来，饭给你热着"。你转身离开了天台。那一通电话，是你这辈子最好的 all-in。'},{text:'再站一会儿……就一会儿',effects:{mental:-15,health:-10,bankroll:5000},feedback:'你没接。风很大。最后你退了下来——不是因为想通了，是因为没勇气。你回到出租屋，发现妈妈打了 17 个未接来电。你删掉了通话记录，假装什么都没发生。但你心里知道，刚才有多近。'}]},
  // ===== Phase 3 概率决策事件（5个，id 200-204）EV 数学已验算 =====

  // EV: 底池4000,call2000,需25%胜率,实际60%→call. EV=0.6×6000-0.4×2000=+2800
  {id:200,title:'河牌的致命call',text:'现金桌，河牌已发。底池4000，对手all-in 2000。你call后总池8000，花2000追6000——盈亏平衡胜率仅需25%。你重新读牌，估计自己手牌胜率约60%。底池赔率给你3:1，你的胜率明显过高。该不该接？',minAge:22,maxAge:55,weight:6,mode:'repeat',conditions:{minBankroll:5000},choices:[{text:'Call 2000，相信读牌',effects:{bankroll:6000,skill:10,mental:6},feedback:'正确决策！EV=0.60×6000−0.40×2000=+2800，远高于fold的0。这次你赢了，收下6000——但要记住：你有40%的概率会输。长期盈利靠的是重复这种+EV的call，而不是回避它。'},{text:'Fold，保住2000更稳',effects:{bankroll:0,skill:-8,mental:-4},feedback:'结果导向陷阱。你只需25%胜率就能盈利，而你估测有60%——每次call期望赚2800。fold看似安全，实则每次放弃+2800 EV。怕波动≠正确决策。'}]},

  // EV: 22 call 50,中set概率12%,需赢回417. 对手深筹码2000,中set平均赢1000→call. EV=0.12×1000-0.88×50=+76
  {id:201,title:'小对子的set mining',text:'翻牌前你拿到22。前面玩家加注到50，对手后手还有约2000（深筹码）。口袋对子翻牌中set概率约12%（约7.3:1）。隐含赔率要求：你call 50，需在中的时候平均赢回50/0.12≈417才能回本。对手深筹码意味着中set后完全有机会赢远超417。该跟还是该弃？',minAge:22,maxAge:55,weight:6,mode:'repeat',conditions:{minBankroll:5000},choices:[{text:'Call 50，做set mining',effects:{bankroll:950,skill:9,mental:4},feedback:'正确！对手深筹码，中set后可赢1000+，EV=0.12×1000−0.88×50=+76。这次你中了set赢下950。注意：88%的时候你会输掉这50，但只要中的时候赢够417+，长期就是赚的。set mining的核心是"对手够深"。'},{text:'Fold，小对子没前途',effects:{bankroll:0,skill:-7,mental:-2},feedback:'过于保守。你省下了50，却放弃了EV≈+76的隐含赔率机会。对手深筹码时set mining是经典+EV玩法。若对手短筹码（后手不足417），那才该fold。'}]},

  // EV: MTT决赛桌ICM. cEV该call但ICM下fold奖金期望更高. 正确=fold
  {id:202,title:'决赛桌的ICM抉择',text:'MTT决赛桌，你是筹码第3名。一个短筹码all-in。按纯粹筹码期望值（cEV）算，这手call在筹码上是+EV的。但这是锦标赛：奖金按名次阶梯跳跃，第3名奖金远高于被淘汰后的低名次。一旦call输了，你就从争冠位直接跌出大额奖金区。cEV让你call，ICM让你fold。',minAge:24,maxAge:55,weight:5,mode:'repeat',conditions:{minBankroll:10000},choices:[{text:'Fold，保住第3名奖金',effects:{bankroll:0,skill:12,mental:8},feedback:'顶级ICM决策！虽然这手call在筹码上是+cEV，但锦标赛奖金的阶梯结构让你"被淘汰的代价"远大于"翻倍的收益"。职业玩家在决赛桌会大量放弃+cEV的手牌——生存即奖金。'},{text:'Call，筹码+EV就该接',effects:{bankroll:-8000,skill:-10,mental:-8},feedback:'你call了并且被淘汰，奖金大幅缩水。错在用现金桌的cEV思维打锦标赛决赛桌。ICM告诉我们：当奖金跳跃巨大时，+chip EV的call可能是−$EV的。这是MTT与现金桌最大的区别。'}]},

  // EV: 9 outs同花draw,翻牌到河牌35%. 半池下注需25%胜率. 35%>25%→call. EV=0.35×3000-0.65×1000=+400
  {id:203,title:'同花draw的追击',text:'翻牌后你已有4张同花（手两张+翻牌两张），还剩turn和河牌。deck里还有9张你的花色（9 outs），从翻牌到河牌成花概率约35%。底池2000，对手下注半池1000，你需call 1000。call后总池4000，盈亏平衡胜率=1000/4000=25%。你的35%胜率高于门槛。',minAge:22,maxAge:55,weight:6,mode:'repeat',conditions:{minBankroll:5000},choices:[{text:'Call 1000追同花',effects:{bankroll:3000,skill:8,mental:5},feedback:'正确！EV=0.35×3000−0.65×1000=+400。这次你河牌成花赢下3000。但要清醒：65%的时候你不会成花而输掉1000——追花的合理性来自"赔率够好"而非"一定会中"。'},{text:'Fold，draw太冒险',effects:{bankroll:0,skill:-7,mental:-3},feedback:'放弃了+400 EV的draw。你只需25%胜率就能盈利，而你有35%——每次追期望赚400。反例：如果只剩一张牌且对手满池下注，9/47≈19%<33%所需，那时才该fold。赔率决定一切。'}]},

  // EV: 每手扣1元,中bad beat概率1/155000,奖金10万. EV=(1/155000)×100000-1≈-0.355/手. 长期负EV→不买
  {id:204,title:'Bad Beat Jackpot保险',text:'牌室推销"Bad Beat Jackpot"附加险：每手自动扣1元进入奖池，如果你在极罕见的bad beat中招，就能赢100000元。听起来诱人——但bad beat出现概率约1/155000手。你算一下：每手投1元，中奖期望=(1/155000)×100000≈0.645元。你每手净亏约0.355元。该买吗？',minAge:22,maxAge:55,weight:6,mode:'repeat',conditions:{minBankroll:3000},choices:[{text:'不买，这是负EV抽水',effects:{bankroll:0,skill:9,mental:4},feedback:'清醒！每手EV=(1/155000)×100000−1≈−0.355元，长期稳定亏损。打10000手亏3550元——这是disguised成"保险"的抽水。拒绝负EV是职业玩家的基本素养。'},{text:'买，万一中了10万呢',effects:{bankroll:-150,skill:-5,mental:-3},feedback:'你开了附加险，扣了约150元手续费，当然没中——1/155000意味着你要打几十万手才"期望"中一次。"万一中"是典型彩票思维：用确定的小额亏损换极低概率的巨奖。把它当娱乐可以，别当投资。'}]},

  // ===== Phase 3 行业生态事件（18个，id 205-222）真实原型标注 =====

  // 主题1:平台与监管 | 原型:GG/PokerStars KYC、Black Friday、银行反洗钱、平台退出市场
  {id:205,title:'收入证明',text:'GGPoker安全部门要求你14天内提交近三年合法收入证明，以解释账户内8万资金来源。你被标注为"高风险职业玩家"。打牌这些年你从没报过税，银行流水全是USDT入账，开不出任何凭证。客服暗示：很多人"找朋友的公司帮忙开一张"。',minAge:25,maxAge:50,weight:6,mode:'once',conditions:{minBankroll:50000},choices:[{text:'找朋友公司开虚假收入证明',effects:{bankroll:-2000,mental:-15,reputation:-2},setFlag:'kyc_fraud',feedback:'证明通过审核，资金解冻。但你从此睡不踏实，每次收到平台系统邮件都心惊肉跳——这张证明像悬在头顶的刀。'},{text:'如实说明是扑克收入，接受可能被冻结',effects:{bankroll:-30000,mental:-8,reputation:5},feedback:'平台以"无法核实收入合法性"为由冻结了60%资金。你保住了良心，却损失惨重，接下来几个月只能靠剩余bankroll硬撑。'}]},
  {id:206,title:'银行问钱从哪来',text:'你从平台提现25000到储蓄卡，第二天银行电话就来了："这笔大额入账无法解释来源，账户已临时冻结60天配合反洗钱调查。"柜员追问"有完税证明吗？有赛事证书吗？"你卡壳了。家人站在旁边，第一次知道你账户里躺着这么多来历不明的钱。',minAge:26,maxAge:48,weight:7,mode:'once',conditions:{minBankroll:25000},choices:[{text:'编"海外电商投资回报"糊弄过去',effects:{bankroll:0,mental:-18,reputation:-3},setFlag:'bank_investigation',feedback:'银行暂未深究，但这笔记录进了反洗钱系统。未来贷款、买房、办信用卡，这张调查记录随时可能被翻出来。家庭关系也紧张了。'},{text:'坦白是扑克收入，补缴个税开完税证明',effects:{bankroll:-5000,mental:-5,reputation:6},feedback:'冻结解除。你花了一笔税款和手续费，换来一张干净的资金证明。从此资金通道正规化，再不用担心被二次冻结。'}]},
  {id:207,title:'平台连夜撤出',text:'凌晨三点，你所在的线上平台突然发公告：因"合规调整"，即日起退出你所在国家市场，所有账户72小时内停止服务。你的42000 bankroll被标记"待官方提现通道开放后处理"。论坛已经炸锅，有人喊"再不提就变下一个Black Friday"。各种"代提中介"在群里抽25%。',minAge:25,maxAge:50,weight:5,mode:'once',conditions:{minBankroll:30000},choices:[{text:'走官方通道，老老实实排队等',effects:{bankroll:-8000,mental:-12},feedback:'官方拖了8个月才分批放款，中途因汇率波动缩水。这大半年你的资金完全卡死，错过好几个价值百万的卫星赛窗口。'},{text:'找25%抽成的代提中介，赌速度',effects:{bankroll:-12000,mental:-10,reputation:-2},setFlag:'used_proxy',feedback:'中介三天到账，代价是高额抽成和把账户信息交给陌生人。后来听说有人遇到中介跑路血本无归——你只是运气好。'}]},

  // 主题2:灰色地带 | 原型:USDT币商跑路、伙牌团伙、不明资金过账
  {id:208,title:'币商失联',text:'你通过Telegram群找到的USDT币商"老周"，一直是圈内口碑不错的换汇渠道。这次你打给他等值3万的人民币，准备换U出金打比赛。转账后对方迟迟不放U，半小时后——消息不回了。群里一搜，最近一周已经有六个人被同一个币商坑了。',minAge:27,maxAge:50,weight:6,mode:'repeat',conditions:{minBankroll:20000},choices:[{text:'报警，如实说明是USDT换汇被骗',effects:{bankroll:-30000,mental:-15,reputation:-3},setFlag:'police_record',feedback:'警察受理了，但暗示你"私下换汇本身违规"。更糟的是，你的换汇记录进了系统，后续所有大额资金流动都被盯上。'},{text:'咽下这口气，换更贵但正规的渠道',effects:{bankroll:-33000,mental:-8},feedback:'你咬牙走P2P正规平台，汇率亏了一截，手续费又是一刀。心疼，但至少没把人搭进去。这次教训让你彻底告别了野路子。'}]},
  {id:209,title:'一起干票大的',text:'一个认识三年的圈内"大哥"私下找到你："我们有个六人组，在25/50的牌桌上配合，互通讯息、联手抽水，每月稳定3万+。你GTO打得不错，正好缺个核心位。"团队里甚至有你崇拜过的pro。"现在线上RTA泛滥，单干早晚被AI吃干。"加入意味着背叛你标榜的"清白玩家"认同。',minAge:28,maxAge:50,weight:6,mode:'once',conditions:{minBankroll:20000},choices:[{text:'拒绝，继续一个人清白地打',effects:{bankroll:0,mental:-10,reputation:8},setFlag:'clean_player',feedback:'"大哥"脸色一沉，从此把你当外人。圈子里开始流传你"不合群""太轴"。你的牌桌依旧干净，但每一手都在跟机器、跟团伙、跟整个时代较劲。'},{text:'加入团伙，抱团吃这波红利',effects:{bankroll:25000,mental:-12,reputation:-8},setFlag:'collusion_member',feedback:'第一个月分到2.5万，你拿钱的手在抖。但从此你头顶悬着封号、黑名单、甚至法律风险。钱变多了，觉却睡不踏实了。'}]},
  {id:210,title:'帮个忙，过个账',text:'一个跟你打过几次线下的"老朋友"突然开口："兄弟，有笔1.5万急用，先转你账户过一下，半小时就转走，给你500茶水费。具体来源别多问。"你心里咯噔一下——这种"过账"十有八九是来路不明的钱。但人家开口了，你面子上抹不开。',minAge:25,maxAge:50,weight:5,mode:'repeat',conditions:{minBankroll:15000},choices:[{text:'帮这一次，拿了茶水费',effects:{bankroll:500,mental:-10,reputation:-3},setFlag:'money_laundering',feedback:'钱转进转出很快。但第二天你就收到银行短信："您的账户存在异常交易，已被临时限制非柜面业务。"那1.5万的流水像一颗雷，埋进了你的征信记录。'},{text:'坚决拒绝，宁可翻脸',effects:{bankroll:-2000,mental:-5,reputation:5},feedback:'朋友当场黑脸。之后他确实在几个线下局把你排挤了，你损失了一些软场机会。但你的账户干干净净，半夜敲门也不慌。'}]},

  // 主题3:国际偏见 | 原型:WSOP盯梢、2+2"中国bot论"、签证难
  {id:211,title:'被全程盯着打',text:'WSOP主赛事Day3，你筹码健康。但你注意到，每隔一小时荷官就换新牌，地板经理在你这一桌附近转悠得格外久。邻桌的美国老哥"好心"提醒你："哥们，他们盯你一整天了。上周有个亚洲面孔的伙牌团伙被带走，你们这长相现在都敏感。"那种基于种族的凝视，正在蚕食你的专注力。',minAge:26,maxAge:48,weight:6,mode:'once',conditions:{minBankroll:30000},choices:[{text:'强忍着继续打，用成绩证明自己',effects:{bankroll:0,mental:-15,skill:2},feedback:'你咬牙打完了主赛事，进了钱圈。但精神代价巨大——那种被当成潜在罪犯的屈辱感，让你回国后整整一周不想碰牌。'},{text:'当场礼貌质问地板经理',effects:{bankroll:-8000,mental:-8,reputation:4},feedback:'地板经理尴尬地否认，但接下来你被频繁要求出示ID、被换桌两次。提前出局。不过你的事被推特曝光后，引发了对"种族偏见"的讨论。'}]},
  {id:212,title:'中国bot论',text:'一个海外扑克论坛的置顶帖标题：《The Chinese Bot Problem: Why NL500+ winrates from CN accounts are statistically impossible》。楼主用数据"论证"，声称像你这样的中国高赢率账号"要么是RTA，要么是伙牌"。帖子盖了几百楼，你的DM里塞满辱骂。可你的每一手牌都是真刀真枪打出来的。',minAge:27,maxAge:48,weight:6,mode:'once',conditions:{minBankroll:25000},choices:[{text:'公开直播打牌+公开手牌数据库自证',effects:{bankroll:-3000,mental:-12,reputation:10,skill:1},feedback:'你开了72小时直播，导出三百万手牌供审计。质疑声小了一半，但另一半说"数据可以造假"。你无法叫醒装睡的人。不过一批理性玩家力挺你，国际声誉反而提升了。'},{text:'沉默是金，屏蔽噪音继续打',effects:{bankroll:0,mental:-18,reputation:-5},feedback:'你没回应，但"中国bot"的标签像烙印贴在你身上。此后申请海外赞助都被婉拒，理由永远是"舆论风险"。沉默保住了精力，却让你越来越边缘化。'}]},
  {id:213,title:'签证官不信你',text:'为了参加WSOP主赛事，你申请美国签证。面签时签证官皱眉："您职业写的是Professional Poker Player，我们无法核实这种职业的稳定收入。另外，您的银行流水大量标注online gaming。很抱歉，根据214(b)条款，我必须拒绝。"三年的备战计划可能泡汤。',minAge:28,maxAge:45,weight:5,mode:'once',conditions:{minBankroll:40000},choices:[{text:'重新包装职业为"投资顾问"，补资产证明再签',effects:{bankroll:-8000,mental:-10,reputation:-2},setFlag:'visa_repackaged',feedback:'你找会计做了一套"投资顾问"材料。二次面签，签证官将信将疑，最终批了短有效期单次入境签证。你赶上WSOP尾声，但错过主赛事。从今往后你的"职业牌手"身份成了一笔必须粉饰的烂账。'},{text:'放弃赴美，转战澳门/东南亚/欧洲赛事',effects:{bankroll:-15000,mental:-8,skill:1},feedback:'你转向EPT巴塞罗那、WPT澳门。赛事强度不输WSOP，但路费住宿让总开销翻倍。WSOP金手链的荣耀，可能这辈子摸不到了。'}]},

  // 主题4:AI冲击 | 原型:2019 PioSolver、2023 GPT辅助、2025 RTA泛滥
  {id:214,title:'被一张图打醒',text:'2019年，圈内人人都在谈PioSolver。一个跟你水平相当的朋友掏出电脑，给你看他用solver跑的3-bet pot river决策树："你看，你这几年在这个节点一直bet小额，但GTO应该是73%频率overbet。难怪你长期在这里漏水。"你引以为傲的"读人""经验""手感"，在数学面前原形毕露。',minAge:25,maxAge:45,weight:7,mode:'once',conditions:{minBankroll:20000},choices:[{text:'咬牙买PioSolver+高配电脑，系统重构打法',effects:{bankroll:-2000,mental:-8,skill:6},feedback:'一笔巨款，而且接下来半年你几乎不打牌，全在啃solver。胜率回升是肯定的，但你发现solver时代勤奋成了入场券，天赋不再稀缺。你追上了时代，也被裹挟进军备竞赛。'},{text:'不相信机器，继续靠直觉和经验打',effects:{bankroll:-12000,mental:-6,reputation:-2},setFlag:'solver_resister',feedback:'半年后，你的胜率肉眼可见下滑。曾经的手下败将一个个超越了你。你嘴上还说"扑克是人的游戏"，但深夜复盘时你知道自己正在被淘汰。'}]},
  {id:215,title:'AI替你打',text:'2023年，某知名线上高额桌常客被扒出用GPT-4接入实时手牌识别，边打边让AI给GTO建议，胜率高得离谱。当晚，一个灰色群发来私信："兄弟，有款新RTA工具，GPT接口，实时给GTO答案，月费500，稳赢。要不要？"群里有你尊敬的人。',minAge:25,maxAge:45,weight:7,mode:'once',conditions:{minBankroll:25000},choices:[{text:'举报这个群，公开呼吁平台治理RTA',effects:{bankroll:-5000,mental:-10,reputation:10},setFlag:'rta_whistleblower',feedback:'你成了"吹哨人"，平台确实封了一批号。但你也上了灰色势力的黑名单。更讽刺的是，你举报后自己线上胜率不升反降——因为比你老实的同行纷纷退场，留下的全是更隐蔽的作弊者。'},{text:'睁一只眼闭一只眼，默默转线下',effects:{bankroll:-8000,mental:-5},feedback:'你没碰那个工具，但也没勇气发声。你把主要精力转向线下赛事。算是独善其身了，可每次看到某个"天才少年"赢率逆天，你都会怀疑：这届扑克，还有干净的吗？'}]},

const STAT_KEYS=['bankroll','skill','mental','reputation','health','age'];
const YEAR_EVENTS_PER_YEAR=1;

let state=null;
let triggeredEventIds=new Set();
let eventHistory=[];
let currentEvent=null;
let showingFeedback=false;
// repeat 事件年度冷却：同一 repeat 事件在本年内已触发过的 id 集合。
// 修 bug：原 getAvailableEvents 对 repeat 事件无冷却，极端情况下玩家可能
// 一年内连续抽到两次"Bad Beat"/"Tilt失控"，叙事跳跃。每年（age 自增后）清空。
let yearCooldownEvents=new Set();
// repeat 事件跨年分级冷却：记录每个 repeat 事件"下次可触发的最早年龄"。
// 修"同样事件频繁重复触发"问题：按事件叙事密度分 3/5/8/12 年冷却。
// eventCooldownUntil[id] = 下次允许触发的 state.age。
let eventCooldownUntil={};

function createState(bgKey){
  const bg=BACKGROUNDS[bgKey];
  return {
    bankroll:bg.stats.bankroll,
    skill:bg.stats.skill,
    mental:bg.stats.mental,
    reputation:bg.stats.reputation,
    health:bg.stats.health,
    age:bg.stats.age,
    talentId:null,
    flags:[],
    careerEarnings:0,
    careerLosses:0,
    biggestWin:0,
    yearEvents:[],
    alive:true,
    ended:false,
    endingType:null,
    bgKey:bgKey,
    lastChoiceType:null,
    streak:0,
    aggressiveWins:0,
    activeState:null,
    stateTurns:0,
    lastLuckAge:null   // 锦鲤天赋（id=13）"每10年横财"的上次发放年龄；修 age%10 对齐 bug
  };
}

function applyTalent(state,talentId){
  const t=TALENTS.find(x=>x.id===talentId);
  if(!t)return;
  state.talentId=talentId;
  for(let[k,v] of Object.entries(t.effect)){
    if(k in state)state[k]+=v;
  }
  if(t.id===2)state.mental=Math.max(state.mental,30);
  if(t.id===9)state.health=Math.max(state.health,20);
  if(t.id===13)state.lastLuckAge=state.age;  // 锦鲤：锚定起始年龄，每10年后发放
}

// repeat 事件分级冷却期（年）。按叙事密度分级，防止"同样事件频繁重复触发"。
//   日常/牌局类(3年)：常规研磨、设备、巨鲸、cooler、NL门槛、夜话等——高频但低戏剧
//   关系/求助类(5年)：借钱、求助、邮件、学生、打零工、生病等——中频中戏剧
//   情绪/危机类(8年)：Tilt、Downswing、破产、冷撤退、质疑、债主、复仇等——低频高戏剧
//   转折/浓烈类(12年)：第一次被Bad Beat(人生第一次，不应频繁复刻)
// 事件自带 ev.cooldown 字段时优先用，否则按 id 查表，默认 5 年。
const COOLDOWN_3Y=new Set([65,67,68,109,111,112,130,131,132,133,142,151]);  // 日常/牌局
const COOLDOWN_5Y=new Set([35,59,66,116,124,129,140,162,167]);              // 关系/求助
const COOLDOWN_8Y=new Set([4,11,13,21,31,38,53,113,114,115,118,123,125,126,127,128,134,135,169,170,171,174]); // 情绪/危机
const COOLDOWN_12Y=new Set([4]); // 转折——注意 id=4 在 8Y 和 12Y，下方逻辑取较大值
function repeatCooldownYears(evId){
  // 事件自带字段优先
  const ev=EVENTS.find(e=>e.id===evId);
  if(ev&&ev.cooldown)return ev.cooldown;
  let y=5; // 默认
  if(COOLDOWN_3Y.has(evId))y=3;
  if(COOLDOWN_5Y.has(evId))y=5;
  if(COOLDOWN_8Y.has(evId))y=8;
  if(COOLDOWN_12Y.has(evId))y=Math.max(y,12);
  return y;
}

function getAvailableEvents(){
  const valid=[];
  for(let ev of EVENTS){
    if(state.age<ev.minAge||state.age>ev.maxAge)continue;
    if(ev.mode==='once'&&triggeredEventIds.has(ev.id))continue;
    // repeat 事件：年度冷却（本年内不重复）+ 跨年分级冷却（防频繁重复）
    if(ev.mode==='repeat'){
      if(yearCooldownEvents.has(ev.id))continue;
      if(eventCooldownUntil[ev.id]!==undefined&&state.age<eventCooldownUntil[ev.id])continue;
    }
    const c=ev.conditions||{};
    if(c.minBankroll!==undefined&&state.bankroll<c.minBankroll)continue;
    if(c.maxBankroll!==undefined&&state.bankroll>c.maxBankroll)continue;
    if(c.minSkill!==undefined&&state.skill<c.minSkill)continue;
    if(c.maxSkill!==undefined&&state.skill>c.maxSkill)continue;
    if(c.minMental!==undefined&&state.mental<c.minMental)continue;
    if(c.maxMental!==undefined&&state.mental>c.maxMental)continue;
    if(c.minReputation!==undefined&&state.reputation<c.minReputation)continue;
    if(c.maxReputation!==undefined&&state.reputation>c.maxReputation)continue;
    if(c.minHealth!==undefined&&state.health<c.minHealth)continue;
    if(c.maxHealth!==undefined&&state.health>c.maxHealth)continue;
    if(c.requiredTalents&&!c.requiredTalents.includes(state.talentId))continue;
    if(c.excludedTalents&&c.excludedTalents.includes(state.talentId))continue;
    if(c.requiredFlags){
      let ok=true;
      for(let f of c.requiredFlags){if(!state.flags.includes(f)){ok=false;break}}
      if(!ok)continue;
    }
    if(c.excludedFlags){
      let blocked=false;
      for(let f of c.excludedFlags){if(state.flags.includes(f)){blocked=true;break}}
      if(blocked)continue;
    }
    valid.push(ev);
  }
  return valid;
}

function weightedRandom(events){
  if(events.length===0)return null;
  let totalW=0;
  for(let e of events)totalW+=(e.weight||5);
  let r=Math.random()*totalW;
  for(let e of events){r-=(e.weight||5);if(r<=0)return e}
  return events[events.length-1];
}

function getEnding(){
  // 硬性归零结局（5 个属性 = 5 种"游戏结束"）。Phase 2 补齐：原仅 bankroll/health
  // 有归零结局，skill/mental/reputation 归零时静默滑入 normal——玩家看着数值见底却无叙事
  // 收尾。现补全 4 个属性归零结局，让"触底"有戏剧后果。

function clampStats(){
  state.skill=Math.max(0,Math.min(100,state.skill));
  state.mental=Math.max(0,Math.min(100,state.mental));
  state.reputation=Math.max(0,Math.min(100,state.reputation));
  state.health=Math.max(0,Math.min(100,state.health));
  if(state.talentId===2)state.mental=Math.max(30,state.mental);
  if(state.talentId===9)state.health=Math.max(20,state.health);
}

function applyEffects(effects){
  const delta={};
  for(let[k,v] of Object.entries(effects)){
    if(k in state){
      const old=state[k];
      let change=v;
      if(state.talentId===12){change=Math.round(change*1.5)}
      if(state.talentId===2&&k==='mental'&&change<0)change=Math.round(change*0.5);
      state[k]+=change;
      delta[k]=change;
      if(k==='bankroll'){
        if(change>0)state.careerEarnings=(state.careerEarnings||0)+change;
        else state.careerLosses=(state.careerLosses||0)+Math.abs(change);
        if(change>0&&change>(state.biggestWin||0))state.biggestWin=change;
      }
    }
  }
  // 损失厌恶（Phase 3 心理机制）：bankroll 变动 → 非对称 mental 反应。
  // 真实依据 Tversky & Kahneman (1992) 损失厌恶系数 λ=2.25，价值函数曲率 α=0.88。
  // 等额亏损的心理痛感是收益快感的 2.25 倍；且边际递减（幂曲线软化巨幅波动）。
  // 死区 10：微小波动（<1万）不计入心理冲击，避免日常噪音反复拨动 mental。
  if(delta.bankroll!==undefined&&Math.abs(delta.bankroll)>=10000){
    const absB=Math.abs(delta.bankroll);
    const scaled=Math.pow(absB/50000,0.88);  // 5万=1单位心理冲击（校准锚点）
    if(delta.bankroll>0){
      state.mental=Math.min(100,state.mental+scaled);            // 收益侧
    }else{
      state.mental=Math.max(0,state.mental-scaled*2.25);          // 亏损侧 ×2.25
    }
  }
  clampStats();
  // 锦鲤天赋：每满 10 年发放一次横财。修 bug：原用 state.age%10===0，
  // 但年龄从背景初值（20/22/25/27）起跳，%10 只在 20/30/40/50 命中，
  // 海归(25)/上班族(27) 等背景会少拿 1-2 次。改为按"距上次发放满 10 年"判定。
  if(state.talentId===13&&state.lastLuckAge!==null&&(state.age-state.lastLuckAge)>=10){
    state.bankroll+=10000;delta.bankroll=(delta.bankroll||0)+10000;
    state.lastLuckAge=state.age;
  }
  return delta;
}

function processChoice(choice){
  // Tilt 状态（Phase 3 强化）：真实研究 tilt 时 winrate 降 50%+。
  // ① 负面效果 ×1.5（伤害加深）② 正面效果 ×0.5（胜率砍半）③ 该年额外 mental-2（情绪内耗）
  let effs=Object.assign({},choice.effects||{});
  if(state.activeState==='tilt'){
    const adjusted={};
    for(let[k,v]of Object.entries(effs)){
      if(v>0)adjusted[k]=Math.round(v*0.5);       // 正面收益减半（winrate -50%）
      else if(v<0)adjusted[k]=Math.round(v*1.5);   // 负面加深
      else adjusted[k]=v;
    }
    adjusted.mental=(adjusted.mental||0)-2;         // tilt 年额外情绪内耗
    effs=adjusted;
  }
  const delta=applyEffects(effs);
  if(choice.setFlag&&!state.flags.includes(choice.setFlag))state.flags.push(choice.setFlag);
  if(choice.removeFlag)state.flags=state.flags.filter(f=>f!==choice.removeFlag);
  // 状态机更新（连胜/状态触发）
  const stateToast=updateStreakState(choice);
  if(state.bankroll<=0||state.health<=0||state.age>=60){
    const ending=getEnding();
    state.ended=true;state.endingType=ending.type;
    state.endingTitle=ending.title;state.endingDesc=ending.desc;
  }
  delta.__stateToast=stateToast;
  delta.__tilted=(state.activeState==='tilt');
  return delta;
}

function saveGame(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({state,triggeredEventIds:[...triggeredEventIds],eventCooldownUntil,eventHistory}))}catch(e){}
}
function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return false;
    const data=JSON.parse(raw);
    state=data.state;
    // 存档向后兼容：补齐状态机新字段
    if(state.lastChoiceType===undefined)state.lastChoiceType=null;
    if(state.streak===undefined)state.streak=0;
    if(state.aggressiveWins===undefined)state.aggressiveWins=0;
    if(state.activeState===undefined)state.activeState=null;
    if(state.stateTurns===undefined)state.stateTurns=0;
    if(state.lastLuckAge===undefined)state.lastLuckAge=null;  // 向后兼容：旧存档补锦鲤字段
    triggeredEventIds=new Set(data.triggeredEventIds||[]);
    yearCooldownEvents=new Set();   // 加载时重置年度冷却（本年内）
    eventCooldownUntil=data.eventCooldownUntil||{};  // 加载跨年冷却（向后兼容：旧存档为空）
    eventHistory=data.eventHistory||[];
    return true;
  }catch(e){return false}
}

const app=document.getElementById('app');

function render(html){app.innerHTML=html}

function formatMoney(n){
  if(Math.abs(n)>=10000)return (n/10000).toFixed(1)+'万';
  return n.toLocaleString();
}

// 自动推断选项风险等级，显示提示图标（不剧透具体数值）。
// 复用 choiceType 的阈值，避免两套判定漂移（修 bug：原 riskTag 与 choiceType
// 各自硬编码同一组阈值，改一处忘改另一处会导致"风险标签"与"状态机判定"不一致）。
function riskTag(choice){
  const t=choiceType(choice);
  if(t==='aggressive')return '<span class="risk-tag risk-high">⚠ 高风险</span>';
  if(t==='steady')return '<span class="risk-tag risk-safe">✓ 稳健</span>';
  // neutral 与无 effects 的兜底：有 bankroll/属性波动但未到 aggressive → 抉择
  const e=choice.effects||{};
  const hasImpact=(e.bankroll!==undefined&&e.bankroll!==0)||Object.keys(e).length>0;
  return hasImpact?'<span class="risk-tag risk-mid">♦ 抉择</span>':'';
}

// ============================================================
// STATE MACHINE: 状态依赖引擎
// ============================================================
// 判定单个选项的类型：aggressive(激进) / steady(稳健) / neutral(中性)
function choiceType(choice){
  const e=choice.effects||{};
  const bnkLoss=e.bankroll!==undefined&&e.bankroll<0?Math.abs(e.bankroll):0;
  const bnkGain=e.bankroll!==undefined&&e.bankroll>0?e.bankroll:0;
  const downTotal=Math.abs(Math.min(0,e.health||0))+Math.abs(Math.min(0,e.mental||0))+Math.abs(Math.min(0,e.reputation||0));
  if(bnkLoss>=30000||bnkGain>=100000||downTotal>=15)return 'aggressive';
  if(bnkLoss===0&&downTotal<=3)return 'steady';
  return 'neutral';
}

// 判定事件整体情绪：positive/negative/mixed（用于 Tilt/Heater 强制抽取）
function eventMood(ev){
  // 玩家均匀选择下的事件净期望（bankroll 归一 + 属性加权和）
  let pos=0,neg=0;
  ev.choices.forEach(c=>{
    const e=c.effects||{};
    let score=(e.bankroll||0)/10000+(e.skill||0)*1.5+(e.mental||0)*1+(e.reputation||0)*1+(e.health||0)*1;
    if(score>0)pos+=score;else neg+=Math.abs(score);
  });
  if(pos>neg*1.4)return 'positive';
  if(neg>pos*1.4)return 'negative';
  return 'mixed';
}

// 更新连胜与状态机（在 processChoice 内调用），返回状态变化文案（无变化返回 null）
function updateStreakState(choice){
  const type=choiceType(choice);
  const e=(choice.effects||{}).bankroll||0;
  let toast=null;

  // Grinder 状态下选 aggressive → 立即解除（打破惯性，体现「清醒」出口）
  if(state.activeState==='grinder'&&type==='aggressive'){
    state.activeState=null;state.stateTurns=0;state.streak=0;
    toast='你打破了惯性的循环，重新找回锋芒。⚙️→正常';
  }

  // 连胜计数
  if(type===state.lastChoiceType&&type!=='neutral'){
    state.streak++;
  }else{
    state.streak=1;
    state.aggressiveWins=0;
  }
  if(type==='aggressive'&&e>0)state.aggressiveWins++;else if(type==='aggressive')state.aggressiveWins=0;
  state.lastChoiceType=type;

  // 触发新状态（仅在无活跃状态时）
  if(!state.activeState){
    if(type==='aggressive'&&state.streak>=2&&state.aggressiveWins>=2){
      state.activeState='heater';state.stateTurns=1;
      toast='🔥 你进入火热状态！下个事件会是好事。';
    }else if(type==='aggressive'&&state.streak>=2){
      state.activeState='tilt';state.stateTurns=2;
      toast='😵 你上头了！下个事件会很难，且伤害加深。';
    }else if(type==='steady'&&state.streak>=3){
      state.activeState='grinder';state.stateTurns=3;
      toast='⚙️ 你进入磨王模式：技术稳步提升，但心态在透支。';
    }
  }
  // 燃尽 burnout：长期低心态（<=25）独立触发，不依赖连胜——修 bug：
  // burnout 此前只在 stateLabel 的 map 里有名字，从未被赋值给 activeState，
  // 是"幽灵状态"。现补全：心态连续低迷 → 进入燃尽，持续 3 年，每年 mental 再 -2。
  if(!state.activeState&&state.mental<=25&&state.skill>=45){
    state.activeState='burnout';state.stateTurns=3;
    toast='💀 你燃尽了——天赋还在，但心已经空了。';
  }
  return toast;
}

// 应用 Tilt 加深的伤害（仅放大负向变化，不污染原始 effects）
function applyTiltMultiplier(effects, mult){
  const out={};
  for(const[k,v]of Object.entries(effects||{})){
    if(v<0){out[k]=Math.round(v*mult);}
    else{out[k]=v;}
  }
  return out;
}

// 状态显示文案
function stateLabel(){
  if(!state.activeState)return null;
  const map={tilt:{icon:'😵',name:'上头',tip:'下个事件负面+伤害加深'},heater:{icon:'🔥',name:'火热',tip:'下个事件会好转'},grinder:{icon:'⚙️',name:'磨王',tip:'技术缓涨·心态缓降'},burnout:{icon:'💀',name:'燃尽',tip:'心态濒临崩溃'}};
  const m=map[state.activeState];
  return m?`${m.icon} ${m.name} <span style="color:#5a6a58;font-size:0.85em">(剩${state.stateTurns}年)</span>`:null;
}

function statBar(key,val,max){
  const pct=Math.min(100,Math.max(0,(val/max)*100));
  return `<div class="stat-bar"><div class="stat-bar-fill ${key}" style="width:${pct}%"></div></div>`;
}

function formatStat(key,val){
  const s=STAT_LABELS[key];
  const icon=s.icon||'';
  const suffix=s.suffix||'';
  // 非 bankroll 属性显示时取整（损失厌恶的幂曲线计算、health-0.5 衰减等会产生小数）
  const display=key==='bankroll'?formatMoney(val):(Math.round(val)+suffix);
  let color='#e8e0d0';
  if(key==='bankroll')color='#2a8c58';
  else if(key==='skill')color='#4a8cc0';
  else if(key==='mental')color='#9a6ac0';
  else if(key==='reputation')color='#c0a020';
  else if(key==='health')color='#c04a4a';
  else if(key==='age')color='#8a8a8a';
  return `<div class="stat-item"><span class="stat-label">${icon}${s.name}</span><span class="stat-value" style="color:${color}">${display}</span>${statBar(key,val,key==='bankroll'?1000000:100)}</div>`;
}

function renderStatusBar(){
  let html='';
  for(let k of STAT_KEYS){
    html+=formatStat(k,state[k],k==='bankroll'?1000000:100);
  }
  // 状态机指示器
  const sl=stateLabel();
  if(sl){
    const stColor=state.activeState==='heater'?'#2a8c58':state.activeState==='tilt'?'#e08080':state.activeState==='grinder'?'#d4a843':'#c0c0c0';
    html=`<div style="text-align:center;padding:6px 0;font-weight:bold;color:${stColor};border-bottom:1px solid rgba(255,255,255,0.05)">${sl}</div>`+html;
  }
  return `<div class="status-bar">${html}</div>`;
}

function renderTitle(){
  const hasSave=!!localStorage.getItem(SAVE_KEY);
  render(`
    <div class="title-screen">
      <div class="suits">♠ ♥ ♦ ♣</div>
      <h1>德州扑克职业牌手<br>人生模拟器</h1>
      <div class="subtitle">从Grinder到Legend</div>
      <br>
      <button class="btn btn-primary" onclick="startNewGame()">开始新人生</button>
      ${hasSave?`<button class="btn btn-secondary" onclick="continueGame()" style="margin-top:12px">继续上次人生</button>`:''}
      <div style="margin-top:32px;color:#3a4a38;font-size:0.75em">
        130+ 事件 · 18 种天赋 · 多重结局<br>每局都是独一无二的人生
      </div>
    </div>
  `);
}

// 背景随机分配：越强的出身概率越低（学生党默认60%）
function rollBackground(){
  // [key, 权重] —— Phase 4 扩展到 8 背景，新背景权重较低（更稀有）
  const wheel=[['student',40],['worker',15],['richkid',8],['elite',6],['veteran',8],['singlemom',6],['esports',5],['grinder',4]];
  const total=wheel.reduce((a,b)=>a+b[1],0);
  let r=Math.random()*total;
  for(const [key,w]of wheel){r-=w;if(r<=0)return key;}
  return 'student';
}

function startNewGame(){
  clearSave();
  // 随机分配背景（不可选）
  const bgKey=rollBackground();
  const bg=BACKGROUNDS[bgKey];
  state=createState(bgKey);
  triggeredEventIds=new Set();
  yearCooldownEvents=new Set();  // 新开局：repeat 冷却清空
  eventCooldownUntil={};          // 新开局：跨年冷却清空
  eventHistory=[];
  // 显示「命运的发牌」后自动进入天赋选择
  render(`
    <div class="creation-screen">
      <div class="section-title">🎴 命运为你发了一手起手牌</div>
      <div style="text-align:center;color:#7a9a80;font-size:0.9em;margin-bottom:16px">你无法选择出身，正如你无法选择发到什么牌。</div>
      <div class="bg-cards" style="grid-template-columns:1fr;max-width:420px;margin:0 auto">
        <div class="bg-card selected" style="cursor:default">
          <div class="bg-name">${bg.name}</div>
          <div class="bg-desc">${bg.desc}</div>
          <div class="bg-stats">💰${formatMoney(bg.stats.bankroll)} · 🎯${bg.stats.skill} · 🧠${bg.stats.mental} · ⭐${bg.stats.reputation} · 💪${bg.stats.health} · 📅${bg.stats.age}岁</div>
        </div>
      </div>
      <div style="text-align:center;margin-top:8px">
        <button class="btn btn-primary" onclick="pickTalent()">接受命运，选择天赋 →</button>
      </div>
    </div>
  `);
}

function pickTalent(){
  const pool=[...TALENTS];
  const selected=[];
  for(let i=0;i<3;i++){
    const idx=Math.floor(Math.random()*pool.length);
    selected.push(pool.splice(idx,1)[0]);
  }
  const rarities={common:'普通',rare:'稀有',epic:'史诗',legendary:'传说'};
  render(`
    <div class="creation-screen">
      <div class="section-title">✨ 选择你的天赋</div>
      <div style="color:#7a9a80;text-align:center;font-size:0.9em;margin-bottom:12px">命运的轮盘只给了你三个选择。选一个，它将陪伴你整个生涯。</div>
      <div class="talent-pick">
        ${selected.map(t=>`
          <div class="talent-card talent-${t.rarity}" onclick="confirmTalent(${t.id})">
            <div class="talent-name" style="color:${t.color}">[${rarities[t.rarity]}] ${t.name}</div>
            <div class="talent-desc">${t.desc}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `);
}

function confirmTalent(talentId){
  applyTalent(state,talentId);
  saveGame();
  renderGame();
}

function continueGame(){
  if(!loadGame()){renderTitle();return}
  if(state.ended){renderEnding();return}
  renderGame();
}

function renderGame(){
  if(!state||state.ended){renderEnding();return}
  // 状态机：每年消耗状态持续
  //   Grinder 每年 skill+2 / mental-1；Burnout 每年 mental-2（燃尽期的持续失血）
  if(state.activeState){
    if(state.activeState==='grinder'){
      state.skill=Math.min(100,state.skill+2);
      state.mental=Math.max(0,state.mental-1);
    }
    if(state.activeState==='burnout'){
      state.mental=Math.max(0,state.mental-2);
    }
    if(state.stateTurns>0){
      state.stateTurns--;
      if(state.stateTurns<=0){state.activeState=null;state.streak=0;}
    }
    clampStats();
  }
  // 久坐健康债（Phase 3 心理/生理机制）：年龄越大 health 衰退越快。
  // 真实依据 Harvard/ACC 2024：日均久坐>10.6h 心衰风险+60%，且损害部分不可逆。
  // ageFactor: 20岁=1.0, 35岁=1.5, 50岁=2.0, 60岁=2.33。每年 health 额外衰减。
  // 这与 continueAfterFeedback 里的固定 health-0.5 叠加，暮年总衰减可达 2-3/年。
  const ageFactor=1+(state.age-20)/30;
  if(ageFactor>1){
    state.health=Math.max(0,state.health-(ageFactor-1)*0.8);
    clampStats();
  }
  let html=renderStatusBar();
  const talent=TALENTS.find(t=>t.id===state.talentId);
  const talentHTML=state.talentId!==null&&talent?'<span class="sep">·</span>天赋：<span style="color:'+(talent.color||'#d4a843')+'">'+talent.name+'</span>':'';
  html+=`<div class="age-indicator">📅 ${state.age} 岁 ${talentHTML}</div>`;
  
  if(state.age%5===0&&eventHistory.length>0){
    const recent=eventHistory.slice(-5);
    html+=`<div class="year-review">📋 五年回顾：${recent.map(e=>e.title).join(' → ')}</div>`;
  }

  const available=getAvailableEvents();
  if(available.length===0){
    state.age++;
    yearCooldownEvents=new Set();  // 新的一年：repeat 年度冷却重置
    state.health-=1;
    state.mental-=1;
    // 状态机：空转年也消耗状态持续
    if(state.activeState&&state.stateTurns>0){state.stateTurns--;if(state.stateTurns<=0)state.activeState=null;}
    clampStats();
    saveGame();
    if(state.health<=0||state.age>=60){
      const ending=getEnding();
      state.ended=true;state.endingType=ending.type;
      state.endingTitle=ending.title;state.endingDesc=ending.desc;
      saveGame();
      renderEnding();return;
    }
    html+=`<div class="event-card"><div class="event-title">平淡的一年</div><div class="event-text">这一年没什么大事发生。你照常打牌、吃饭、睡觉。但日复一日的重复让你心里有点空。时间在流逝。</div><div class="feedback-toast" style="color:#c04a4a">健康 -1 · 心态 -1</div></div>`;
    render(`<div class="game-screen">${html}</div>`);
    setTimeout(()=>renderGame(),900);
    return;
  }

  // 状态机扭曲事件抽取：Tilt 强制负面，Heater 强制正面；为空则退化
  let pool=available;
  let stateNote='';
  if(state.activeState==='tilt'){
    const neg=available.filter(ev=>eventMood(ev)==='negative');
    if(neg.length>0){pool=neg;stateNote='😵 上头中——这注定是个难熬的时刻…';}
  }else if(state.activeState==='heater'){
    const pos=available.filter(ev=>eventMood(ev)==='positive');
    if(pos.length>0){pool=pos;stateNote='🔥 火热中——好运在向你招手！';}
  }

  const ev=weightedRandom(pool);
  currentEvent=ev;
  triggeredEventIds.add(ev.id);
  if(ev.mode==='repeat'){
    yearCooldownEvents.add(ev.id);  // 本年内不再重复
    // 跨年分级冷却：设置下次可触发的最早年龄
    eventCooldownUntil[ev.id]=state.age+repeatCooldownYears(ev.id);
  }
  eventHistory.push({id:ev.id,title:ev.title,age:state.age});

  let eventHTML='';
  if(stateNote){
    const nc=state.activeState==='tilt'?'#e08080':'#6ad090';
    eventHTML+=`<div style="text-align:center;padding:6px;margin-bottom:10px;border-radius:6px;background:rgba(${state.activeState==='tilt'?'192,74,74':'42,140,88'},0.12);color:${nc};font-size:0.85em;font-style:italic">${stateNote}</div>`;
  }
  eventHTML+=`<div class="event-card">`;
  eventHTML+=`<div class="event-title">${ev.title}</div>`;
  eventHTML+=`<div class="event-text">${ev.text}</div>`;
  eventHTML+=`<div class="event-choices">`;
  ev.choices.forEach((c,i)=>{
    eventHTML+=`<button class="choice-btn" onclick="makeChoice(${i})">${c.text} ${riskTag(c)}</button>`;
  });
  eventHTML+=`</div></div>`;

  html+=eventHTML;
  render(`<div class="game-screen">${html}</div>`);
}

function makeChoice(choiceIdx){
  if(showingFeedback)return;
  if(!currentEvent)return;
  const choice=currentEvent.choices[choiceIdx];
  if(!choice)return;
  showingFeedback=true;

  const delta=processChoice(choice);
  saveGame();

  // Render feedback
  let feedbackHTML=renderStatusBar();
  feedbackHTML+=`<div class="age-indicator">📅 ${state.age} 岁</div>`;
  feedbackHTML+=`<div class="feedback-toast">${choice.feedback}</div>`;
  if(delta.__stateToast){
    const stColor=state.activeState==='heater'?'#2a8c58':state.activeState==='tilt'?'#c04a4a':'#d4a843';
    feedbackHTML+=`<div class="feedback-toast" style="color:${stColor};font-weight:bold">${delta.__stateToast}</div>`;
  }
  feedbackHTML+=`<div style="text-align:center;color:#5a7a60;font-size:0.85em">点击继续 →</div>`;
  render(`<div class="game-screen" onclick="continueAfterFeedback()">${feedbackHTML}</div>`);

  // Floating effect（Tilt 加深时显示放大后的数值）
  const tilted=!!delta.__tilted;
  let effects=choice.effects||{};
  if(tilted)effects=applyTiltMultiplier(effects,1.5);
  const changes=[];
  for(let[k,v]of Object.entries(effects)){
    if(v===0)continue;
    const s=STAT_LABELS[k];
    const prefix=v>0?'+':'';
    const color=v>0?'#2a8c58':'#c04a4a';
    const tiltTag=(tilted&&v<0)?' <span style="color:#e08080;font-size:0.7em">×1.5</span>':'';
    changes.push(`<span style="color:${color}">${prefix}${k==='bankroll'?formatMoney(v):v}${s.suffix||''} ${s.icon}</span>${tiltTag}`);
  }
  if(changes.length>0){
    const float=document.createElement('div');
    float.className='floating-effect';
    float.innerHTML=changes.join(' ');
    float.style.left=(window.innerWidth/2-140)+'px';
    float.style.top=(window.innerHeight/2-30)+'px';
    float.style.color='#d4a843';
    document.body.appendChild(float);
    setTimeout(()=>float.remove(),1700);
  }

  // Highlight changed stat values in the status bar
  const deltaKeys=Object.keys(delta).filter(k=>delta[k]!==0);
  setTimeout(()=>{
    deltaKeys.forEach(k=>{
      const items=document.querySelectorAll('.game-screen .stat-item');
      items.forEach(item=>{
        if(item.querySelector('.stat-label')&&item.querySelector('.stat-label').textContent.includes(STAT_LABELS[k].name)){
          const v=item.querySelector('.stat-value');
          if(v){v.classList.remove('changed');void v.offsetWidth;v.classList.add('changed');}
        }
      });
    });
  },30);

  currentEvent=null;
}

function continueAfterFeedback(){
  showingFeedback=false;
  state.age++;
  yearCooldownEvents=new Set();  // 新的一年：repeat 年度冷却重置
  // 修 bug：正常打牌的一年只扣 health 不扣 mental，与"打牌磨损心态"的叙事
  // 和 grinder/burnout 状态文案自相矛盾。补上 mental 的轻微自然消耗（-1），
  // 让心态真实下滑、burnout 触发链可达。空转年仍维持 health-1/mental-1。
  state.health=Math.max(0,state.health-0.5);
  state.mental=Math.max(0,state.mental-1);
  clampStats();
  saveGame();
  if(state.ended){
    renderEnding();return;
  }
  if(state.health<=0||state.age>=60){
    const ending=getEnding();
    state.ended=true;state.endingType=ending.type;
    state.endingTitle=ending.title;state.endingDesc=ending.desc;
    saveGame();
    renderEnding();return;
  }
  renderGame();
}

// 结局评级系统（Phase 4）：每个结局给出三维评分——生涯分/人生满意度/传承度。
// 设计哲学：金钱≠幸福。一个破产的人可能满意度高于亿万富翁（如果他心态好、关系在）。
function rateEnding(ending){
  // 生涯分（0-100）：综合成就。bankroll 权重高，但 skill/reputation/age 也算。
  const bankrollScore=Math.min(50,Math.log10(Math.max(1,state.bankroll))/Math.log10(1e8)*50);
  const careerScore=Math.round(bankrollScore+state.skill*0.25+state.reputation*0.25);
  // 人生满意度（0-100）：≠金钱。mental 主导，health 次之，关系（reputation）再次。
  // 一个 mental 高的破产者可以比 mental 崩的富翁更满意。
  const lifeScore=Math.round(state.mental*0.5+state.health*0.3+state.reputation*0.2);
  // 传承度（0-100）：你对这个行业/后人留下了什么。声誉+技术+是否带过徒弟。
  const legacyScore=Math.round(state.reputation*0.4+state.skill*0.3+(state.flags.includes('mentor_master')?30:0));
  // 结局桶标签
  const buckets={legendary:['gto_god','moneymaker','legend','hall_of_fame'],success:['master','steady','entrepreneur','peaceful_exit','content'],ordinary:['normal','retire','graceful_fade'],tragic:['bust','death','disgraced','burned_genius','breakdown','obsolete'],special:['rollercoaster','rich_lonely','fame_empty','weary_survivor']};
  let bucket='ordinary';
  for(const[k,arr]of Object.entries(buckets))if(arr.includes(ending.type))bucket=k;
  return {careerScore:Math.min(100,careerScore),lifeScore:Math.min(100,lifeScore),legacyScore:Math.min(100,legacyScore),bucket};
}

function renderEnding(){
  clearSave();
  const ending=getEnding();
  const t=TALENTS.find(t=>t.id===state.talentId);
  let html=`<div class="ending-screen">`;
  html+=`<div class="suits" style="font-size:1.5em;opacity:0.4">♠ ♥ ♦ ♣</div>`;
  html+=`<div class="ending-title">${ending.title}</div>`;
  html+=`<div class="ending-desc">${ending.desc}</div>`;
  html+=`<div class="ending-stats">`;
  html+=`<div class="row"><span class="label">💰 生涯总盈利</span><span class="val" style="color:#2a8c58">${formatMoney(state.careerEarnings||0)}</span></div>`;
  html+=`<div class="row"><span class="label">💸 生涯总亏损</span><span class="val" style="color:#c04a4a">${formatMoney(state.careerLosses||0)}</span></div>`;
  html+=`<div class="row"><span class="label">🏆 最高单次收入</span><span class="val" style="color:#d4a843">${formatMoney(state.biggestWin||0)}</span></div>`;
  html+=`<div class="row"><span class="label">🎯 最终技术</span><span class="val">${Math.round(state.skill)}</span></div>`;
  html+=`<div class="row"><span class="label">🧠 最终心理</span><span class="val">${Math.round(state.mental)}</span></div>`;
  html+=`<div class="row"><span class="label">⭐ 最终声望</span><span class="val">${Math.round(state.reputation)}</span></div>`;
  html+=`<div class="row"><span class="label">📅 享年</span><span class="val">${Math.round(state.age)}岁</span></div>`;
  html+=`<div class="row"><span class="label">🎴 天赋</span><span class="val" style="color:${t?.color||'#d4a843'}">${t?.name||'无'}</span></div>`;
  html+=`</div>`;

  // 结局评级（Phase 4）：生涯分/人生满意度/传承度
  const rating=rateEnding(ending);
  const bucketLabels={legendary:'🏆 传奇',success:'✨ 成功',ordinary:'🍃 平凡',tragic:'💔 悲剧',special:'🌀 特殊'};
  html+=`<div class="ending-stats" style="margin-top:8px;border-top:1px solid rgba(255,255,255,0.1);padding-top:8px">`;
  html+=`<div class="row"><span class="label">🏷️ 结局评级</span><span class="val">${bucketLabels[rating.bucket]||'🍃 平凡'}</span></div>`;
  html+=`<div class="row"><span class="label">📊 生涯评分</span><span class="val" style="color:#d4a843">${rating.careerScore}/100</span></div>`;
  html+=`<div class="row"><span class="label">😊 人生满意度</span><span class="val" style="color:#2a8c58">${rating.lifeScore}/100</span></div>`;
  html+=`<div class="row"><span class="label">🌱 传承度</span><span class="val" style="color:#9a6ac0">${rating.legacyScore}/100</span></div>`;
  html+=`</div>`;

  // Radar chart
  html+=`<div class="radar-chart"><canvas id="radarCanvas" width="160" height="160"></canvas></div>`;

  html+=`<button class="btn btn-primary" onclick="startNewGame()" style="margin-top:8px">再来一局 ♠</button>`;
  html+=`<button class="btn btn-ghost" onclick="shareResult()" style="margin-top:6px">📋 复制战绩</button>`;
  html+=`</div>`;
  render(html);

  // Draw radar
  setTimeout(()=>{
    const canvas=document.getElementById('radarCanvas');
    if(!canvas)return;
    const ctx=canvas.getContext('2d');
    const cx=80,cy=80,r=65;
    const stats=[{v:state.skill,c:'#4a8cc0'},{v:state.mental,c:'#9a6ac0'},{v:state.reputation,c:'#c0a020'},{v:state.health,c:'#c04a4a'},{v:Math.min(100,(state.bankroll/1000000)*100),c:'#2a8c58'}];
    const labels=['技术','心理','声望','体能','资金'];
    const angles=stats.map((_,i)=>(i*2*Math.PI/stats.length)-Math.PI/2);
    ctx.strokeStyle='#2a3a30';ctx.lineWidth=1;
    for(let lvl=0.2;lvl<=1;lvl+=0.2){
      ctx.beginPath();
      for(let i=0;i<angles.length;i++){
        const x=cx+Math.cos(angles[i])*r*lvl,y=cy+Math.sin(angles[i])*r*lvl;
        i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.closePath();ctx.stroke();
    }
    for(let i=0;i<angles.length;i++){
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(angles[i])*r,cy+Math.sin(angles[i])*r);
      ctx.strokeStyle='#2a3a30';ctx.stroke();
      ctx.fillStyle='#7a9a80';ctx.font='10px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';
      ctx.fillText(labels[i],cx+Math.cos(angles[i])*(r+16),cy+Math.sin(angles[i])*(r+16)+4);
    }
    ctx.beginPath();
    for(let i=0;i<stats.length;i++){
      const v=stats[i].v/100;
      const x=cx+Math.cos(angles[i])*r*v,y=cy+Math.sin(angles[i])*r*v;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.fillStyle='rgba(212,168,67,0.2)';ctx.fill();
    ctx.strokeStyle='#d4a843';ctx.lineWidth=1.5;ctx.stroke();
    for(let i=0;i<stats.length;i++){
      const v=stats[i].v/100;
      const x=cx+Math.cos(angles[i])*r*v,y=cy+Math.sin(angles[i])*r*v;
      ctx.fillStyle=stats[i].c;ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();
    }
  },100);
}

function shareResult(){
  const ending=getEnding();
  const text=`🃏 德州扑克职业牌手人生模拟器\n━━━━━━━━━━\n结局：${ending.title}\n享年：${state.age}岁\n最终资金：${formatMoney(state.bankroll)}\n技术：${state.skill} | 心理：${state.mental}\n声望：${state.reputation} | 体能：${state.health}\n最高单次收入：${formatMoney(state.biggestWin||0)}\n━━━━━━━━━━\n再来一局？`;
  navigator.clipboard.writeText(text).then(()=>{
    const toast=document.createElement('div');
    toast.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a5c38;color:#f0e8c0;padding:12px 24px;border-radius:8px;z-index:200;font-size:0.95em;animation:fadeInOut 2s ease';
    toast.textContent='✅ 战绩已复制到剪贴板！';
    document.body.appendChild(toast);
    setTimeout(()=>toast.remove(),2200);
  });
}
